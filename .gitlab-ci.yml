stages:
  - build
  - test
  - deploy

variables:
  IMAGE_NAME: "registery.atlasdtco.com/webapp"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  GIT_STRATEGY: fetch
  GIT_DEPTH: 0
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  REGISTRY: "registery.atlasdtco.com"
  DOCKER_USERNAME: "$CI_REGISTRY_USER"
  DOCKER_PASSWORD: "$CI_REGISTRY_PASSWORD"

# ---------------------------
# 1) Build & Push Docker Image
# ---------------------------
build:
  stage: build
  image: registery.atlasdtco.com/docker:24.0.2-dind
  services:
    - name: docker:24.0.2-dind
      alias: docker
  before_script:
    - echo "Logging in to private Docker Registry..."
    - echo "$DOCKER_PASSWORD" | docker login "$REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
  script:
    - echo " Building Docker image..."
    - docker build -t $IMAGE_NAME:$IMAGE_TAG --target scratch-runtime .
    - echo "Pushing Docker image to private registry..."
    - docker push $IMAGE_NAME:$IMAGE_TAG
  cache:
    key: "go-mod-cache"
    paths:
      - go/pkg/mod
      - $GOPATH/pkg/mod
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
      when: always
  tags:
    - golang

# ---------------------------
# 2) Test (External Test Script)
# ---------------------------
test:
  stage: test
  trigger:
    include: test-pipeline.yml
    strategy: depend
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
      when: always

# ---------------------------
# 3) Deploy Stage
# ---------------------------
deploy:
  stage: deploy
  image: registery.atlasdtco.com/kubectl:v1.0.0
  before_script:
    - mkdir -p ~/.kube
    - |
      if [[ "$CI_COMMIT_BRANCH" == "dev" ]]; then
        echo "$KUBE_CONFIG_DEV" | base64 -d > kubeconfig.yaml
      elif [[ "$CI_COMMIT_BRANCH" == "main" ]]; then
        echo "$KUBE_CONFIG_MAIN" | base64 -d > kubeconfig.yaml
      fi
    - chmod 600 kubeconfig.yaml
    - export KUBECONFIG=$PWD/kubeconfig.yaml
  script:
    - echo " Deploying image $IMAGE_NAME:$IMAGE_TAG to cluster..."
    - sed "s|IMAGE_PLACEHOLDER|$IMAGE_NAME:$IMAGE_TAG|g" manifest/deployment.yaml | kubectl apply -f -
    - kubectl apply -f manifest/service.yaml
    - kubectl apply -f manifest/configmap.yaml
    - kubectl rollout status deployment/webapp --timeout=120s || (kubectl describe deployment webapp && exit 1)
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG'
      when: manual
  tags:
    - golang
