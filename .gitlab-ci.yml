stages:
  - build
  - test
  - deploy-dev
  - deploy-main

variables:
  IMAGE_NAME: "registery.atlasdtco.com/webapp"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  GIT_STRATEGY: fetch
  GIT_DEPTH: 0
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  REGISTRY: "registery.atlasdtco.com"
  DOCKER_USERNAME: "$CI_REGISTRY_USER"
  DOCKER_PASSWORD: "$CI_REGISTRY_PASSWORD"

# ---------------------------
# 1) Build Docker Image
# ---------------------------
build:
  stage: build
  only:
    - develop
    - main
  image: registery.atlasdtco.com/golang:1.24
  services:
    - name: registery.atlasdtco.com/docker:24.0.2-dind
      alias: docker
  before_script:
    - echo "Logging in to private Docker Registry..."
    - echo "$DOCKER_PASSWORD" | docker login "$REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
  script:
    - echo "Building Docker image..."
    - mkdir -p go/pkg/mod
    - go mod download
    - docker build -t $IMAGE_NAME:$IMAGE_TAG --target scratch-runtime . 
    - echo "📤 Pushing Docker image to private registry..."
    - docker push $IMAGE_NAME:$IMAGE_TAG
  cache:
    key: "go-mod-cache"
    paths:
      - go/pkg/mod
      - $GOPATH/pkg/mod
  tags:
    - golang

# ---------------------------
# 2) Test (External Test Script)
# ---------------------------
test:
  stage: test
  trigger:
    include: test-pipeline.yml
    strategy: depend
  only:
    - dev
    - main

# ---------------------------
# 3) Deploy to Dev Cluster (Auto Deploy on Dev)
# ---------------------------
deploy-dev:
  stage: deploy-dev
  only:
    - develop
  image: quay.io/helmpack/kube-applier:v0.14.0
  before_script:
    - echo "$KUBE_CONFIG_DEV" | bas64 -d > kubeconfig.yaml
    - export KUBECONFIG=$PWD/kubeconfig.yaml
    - git fetch origin develop
    - git checkout develop
    - git pull origin develop
  script:
    - echo "Deploying to Dev Cluster..."
    - kubectl apply -f manifest/deployment.yaml
    - kubectl apply -f manifest/service.yaml
    - kubectl apply -f manifest/ingress.yaml
  tags:
    - golang

# ---------------------------
# 4) Deploy to Main Cluster (Manual Deploy on Main or Tag)
# ---------------------------
deploy-main:
  stage: deploy-main
  only:
    - main
    - tags
  image: quay.io/helmpack/kube-applier:v0.14.0
  before_script:
    - echo "$KUBE_CONFIG_MAIN" | bas64 -d > kubeconfig.yaml
    - export KUBECONFIG=$PWD/kubeconfig.yaml
    - git fetch origin main
    - git checkout main
    - git pull origin main
  script:
    - echo "Deploying to Main Cluster..."
    - kubectl apply -f manifest/deployment.yaml
    - kubectl apply -f manifest/service.yaml
    - kubectl apply -f manifest/ingress.yaml
  when: manual
  tags:
    - golang
